<style>
:root{color-scheme:light;--ink:#171730;--muted:#57566d;--line:#dfddea;--base:#f4f7ff;--accent:#0141f1;--soft:#e7efff;--lime:#deebff}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.45}button,a,input,select{font:inherit}button,a.action{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);min-height:44px;border-radius:15px;padding:9px 15px;font-weight:660}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3169ff;outline-offset:3px}button:disabled{cursor:default;opacity:.65}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1000px;margin:auto;padding:16px 24px}.brand{font-size:22px;letter-spacing:-.07em;font-weight:850;display:flex;align-items:center;gap:8px}.logo{display:block;width:38px;height:38px;border-radius:50%;object-fit:contain}.badge{color:#4e465c;background:#f0edf6;border-radius:99px;padding:4px 8px;font:650 11px system-ui;letter-spacing:.01em}.mode{font-size:13px}
nav{display:flex;gap:8px;max-width:1000px;margin:auto;padding:0 24px}nav button{flex:0 1 auto}nav [aria-current="page"]{background:var(--soft);border-color:#adcbff;color:#0033ae}
main{max-width:1000px;padding:22px 24px 60px;margin:auto}.hero{background:#09215b;color:white;border-radius:30px;padding:30px;position:relative;overflow:hidden;margin-bottom:22px}.hero:after{content:"";position:absolute;inset:auto -75px -145px auto;width:310px;height:250px;background:#103484;border-radius:100%;pointer-events:none}.hero>*{position:relative;z-index:1}.hero p{color:#dbe8ff;max-width:34em}.hero button{background:var(--lime);color:#22223a;border-color:transparent}
h1,h2,h3,p{margin:0 0 10px}h1{font-size:clamp(30px,5vw,53px);line-height:1.04;letter-spacing:-.055em}h2{font-size:24px;letter-spacing:-.04em}h3{font-size:18px;letter-spacing:-.025em}.muted{color:var(--muted)}.stack{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:18px;box-shadow:0 7px 18px #21194508}.suggest{background:#eaf1ff;border-color:#cbdaff}.chip{border-radius:999px;font-size:14px}.chip[aria-pressed="true"]{background:var(--soft);border-color:#8cb1ff;color:#0033ae}.chips,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.subtle{background:transparent}.section{margin-top:24px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.close{width:44px;min-width:44px;padding:0;border-radius:50%;font-size:22px}.label{font-size:13px;font-weight:700;color:#174abb;margin-bottom:6px}.jobline{font-weight:720}.frame{width:min(100%,640px);aspect-ratio:4/3;object-fit:contain;border-radius:20px;display:block;background:#1e1b3b;margin:10px 0}ul,ol{margin-top:8px;padding-left:24px}.notice{min-height:27px;font-size:14px;color:#0033ae;margin-top:6px}.form{display:grid;gap:12px}.form label{display:grid;gap:4px}.form input,.form select{border:1px solid var(--line);border-radius:12px;max-width:28em;padding:9px 12px;min-height:44px;background:#fff;color:var(--ink)}.form input[type="checkbox"]{min-height:auto}.form .check{display:flex;align-items:center;gap:7px}.tiny{font-size:13px}.panel{max-width:700px}.mainrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.mainrow h1{margin-bottom:3px}a{color:var(--accent)}
@media(max-width:540px){header{padding:13px 15px}.brand{font-size:20px}nav{padding:0 15px;gap:5px}nav button{flex:1;font-size:13px;padding:7px 4px;border-radius:12px}main{padding:16px 15px 35px}.hero{padding:22px;border-radius:24px}.card{padding:15px}.mode{font-size:12px;padding:7px 9px}}
</style>
</head>

const jobs = [

const stateKey = 'rozgaar-flow-preview-1';
const defaults = {profile:{role:[], location:[], shift:[], skills:[]}, setup:false, dismissed:false, applications:{}, practiced:false};
let state;
try {state = JSON.parse(localStorage.getItem(stateKey)) || structuredClone(defaults); }
catch {state = structuredClone(defaults);}
let tab='Jobs', screen='list', employer=false, step=1, draft, currentJob=jobs[0], question=0, playing=false, message='';
const main = document.querySelector('#main');
const nav = document.querySelector('#nav');
const mode = document.querySelector('#mode');
function save() { try {localStorage.setItem(stateKey,JSON.stringify(state));} catch {} }
function action(text, cmd, cls='', extra='') {return '<button type="button" data-action="'+cmd+'" class="'+cls+'" '+extra+'>'+text+'</button>';}
function chips(items, selected, key) {return '<div class="chips">'+items.map((x,i)=>action(x,'chip','chip','data-key="'+key+'" data-index="'+i+'" aria-pressed="'+selected.includes(x)+'"')).join('')+'</div>';}
const options = {role:['Warehouse','Garment QC','Security'], location:['Peenya','Bommanahalli'],shift:['Day','Night']};
function skillOptions() { return [...new Set(jobs.filter(j=>!draft.role.length || draft.role.includes(j.role)).flatMap(j=>j.skills))]; }
function reasons(j) { return ['role','location','shift'].filter(k=>state.profile[k].includes(j[k])).map(k=>k==='shift'?'Matches your '+j.shift.toLowerCase()+' shift preference':k==='location'?'In '+j.location:'Matches your '+j.role+' interest');}
function rank() {return [...jobs].sort((a,b)=>reasons(b).length-reasons(a).length);}
function card(j) {
  return '<article class="card"><h3>'+j.name+'</h3><p class="muted">'+j.site+' · '+j.location+'</p><p class="jobline">'+j.pay+' · '+j.time+'</p><p class="muted tiny">'+j.spots+' sample openings</p>'+action('View shift','job','primary','data-id="'+j.id+'"')+'</article>';
}
function setup() {
  return '<section class="card panel"><p class="label">Work profile · '+step+' of 2</p><h1>'+ (step===1?'What work suits you?':'What can you do?') +'</h1><p class="muted">'+(step===1?'Choose the roles, localities and shifts that work for you.':'Pick the tasks you know. You can add more later.')+'</p>'+
    (step===1?'<h3>Roles</h3>'+chips(options.role,draft.role,'role')+'<h3>Locality</h3>'+chips(options.location,draft.location,'location')+'<h3>Shifts</h3>'+chips(options.shift,draft.shift,'shift'):'<h3>Task skills</h3>'+chips(skillOptions(),draft.skills,'skills')+action('New to this work','new'))+
    '<div class="actions">'+(step===2?action('Back','setup-back','subtle'):'')+action(step===1?'Continue':'Save preferences','setup-next','primary')+action('Skip','setup-skip','subtle')+'</div><p class="notice" role="status">'+message+'</p></section>';
}
function list() {
  const ready=state.setup||state.dismissed;
  const ranked=rank();
  const first=ranked[0];
  return '<section class="hero"><h1>See the shift<br>before you travel.</h1><p>Check the workplace and hours. Learn one task. Apply when the shift works for you.</p>'+
    (!ready?action('Set up my work profile','setup')+ ' '+action('Browse all jobs','skip-intro'):'')+'</section>'+
    (state.setup&&!state.dismissed?'<section class="card suggest"><div class="topline"><div><p class="label">'+(reasons(first).length?'Start with this shift':'Open shift')+'</p><h2>'+first.name+'</h2></div>'+action('×','dismiss','close','aria-label="Dismiss suggested shift"')+'</div><p>'+first.location+' · '+first.pay+' · '+first.time+'</p><p class="muted">'+reasons(first).join(' · ')+'</p>'+action('View suggested shift','job','primary','data-id="'+first.id+'"')+'</section>':'')+
    '<section class="section"><h2>Open shifts</h2><div class="grid">'+ranked.map(card).join('')+'</div></section>';
}
function job() {
  const j=currentJob, existing=state.applications[j.id];
  const warehouse=j.id==='warehouse';
  return '<div class="panel">'+action('← Jobs','back','subtle')+'<section class="section stack"><div><p class="label">Sample shift · '+j.spots+' openings</p><h1>'+j.name+'</h1><p>'+j.site+' · '+j.location+', Bengaluru</p></div>'+
    '<section class="card"><h2>Shift details</h2><p class="jobline">'+j.pay+' · '+j.shift+' shift · '+j.time+'</p><p class="muted">Confirm shift availability when you apply. Bring photo ID to an in-person trial if requested by the employer.</p><h3>Skills for this role</h3><p>'+j.skills.join(' · ')+'</p></section>'+

}
function practice() {
  return '<section class="card panel"><p class="label">Optional practice</p><h1>Match the order</h1><p>Pick the item with code '+(question===0?'B17':'B24')+'.</p><div class="actions">'+

}
function apply() {

  const cards=jobs.filter(j=>state.applications[j.id]).map(j=>{
    const a=state.applications[j.id];
    return '<article class="card"><p class="label">'+a.stage+'</p><h3>Anu · Sample worker</h3><p>'+j.name+' · Available for '+j.time+'</p><p class="muted">'+(a.practice?'Completed the practice task':'Practice optional')+'</p>'+
    (a.stage==='Applied'?action('Invite to trial','invite','primary','data-id="'+j.id+'"'):'<p>In-person trial · '+a.slot+'</p>')+'</article>';
  });
  return '<h1>Employer queue</h1><p class="muted">Sample applications in this browser.</p><div class="stack section">'+(cards.length?cards.join(''):'<section class="card">Submit a worker application to see it here.</section>')+'</div>';
}
function render() {
  mode.textContent=employer?'Worker demo':'Employer demo';
  nav.hidden=employer;
  nav.style.display=employer?'none':'';
  nav.innerHTML=['Jobs','Learn','Applications','Profile'].map(x=>action(x,'nav','','data-tab="'+x+'"'+(x===tab?' aria-current="page"':''))).join('');
  if(employer) main.innerHTML=employerView();
  else if(screen==='setup') main.innerHTML=setup();
  else if(screen==='job') main.innerHTML=job();
  else if(screen==='practice') main.innerHTML=practice();
  else if(screen==='apply') main.innerHTML=apply();
  else if(tab==='Applications') main.innerHTML=applications();
  else if(tab==='Profile') main.innerHTML='<h1>Work profile</h1><div class="grid section">'+[['Preferences',[...state.profile.role,...state.profile.location,...state.profile.shift]],['Skills I know',state.profile.skills]].map(([title,values])=>'<section class="card"><h2>'+title+'</h2><p class="muted">'+(values.join(' · ')||'Optional')+'</p>'+action('Edit '+(title==='Preferences'?'preferences':'skills'),title==='Preferences'?'setup':'edit-skills','primary')+'</section>').join('')+'</div>';
  else if(tab==='Learn') main.innerHTML='<h1>Learn a task</h1><section class="card section"><h2>Picking and packing</h2><p>Read an order, match the item code and flag a mismatch.</p>'+action('Open the warehouse lesson','job','primary','data-id="warehouse"')+'</section>';
  else main.innerHTML=list();
}
function go(nextTab='Jobs', nextScreen='list') {tab=nextTab; screen=nextScreen; playing=false; message=''; render(); window.scrollTo(0,0);}
function finishSetup() {state.profile=draft; state.setup=true; state.dismissed=false; save(); go();}
mode.addEventListener('click',()=>{employer=!employer; go(employer?'Jobs':'Applications');});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const {action:cmd,id,key,index}=btn.dataset;
  switch(cmd) {
    case 'nav': go(btn.dataset.tab); break;
    case 'setup':
    case 'edit-skills': draft=structuredClone(state.profile); step=cmd==='setup'?1:2; go('Profile','setup'); break;
    case 'setup-back': step=1; render(); break;
    case 'setup-next': if(step===1){step=2;render();}else finishSetup(); break;
    case 'setup-skip': if(step===1){step=2;render();}else finishSetup(); break;
    case 'skip-intro':
    case 'dismiss': state.dismissed=true;save();go();break;
    case 'chip': {
      const value=(key==='skills'?skillOptions():options[key])[Number(index)];
      if(draft[key].includes(value)) draft[key]=draft[key].filter(x=>x!==value); else draft[key].push(value);
      btn.setAttribute('aria-pressed',String(draft[key].includes(value)));
      break;
    }
    case 'new': draft.skills=[]; message='You can learn on the job. Continue whenever you are ready.'; render(); break;
    case 'job': currentJob=jobs.find(j=>j.id===id);go('Jobs','job');break;
    case 'back': go();break;
    case 'applications': go('Applications');break;
    case 'return-job': go('Jobs','job');break;
    case 'preview': playing=!playing;render();break;
    case 'practice': question=0;go('Jobs','practice');break;
    case 'wrong': question=1;message='Compare the whole code. Now try a fresh order.';render();break;
    case 'correct': state.practiced=true;save();message='Correct. Your practice is saved.';render();break;
    case 'apply': go('Jobs','apply');break;
    case 'invite': if(employer&&state.applications[id]?.stage==='Applied'){
      state.applications[id].stage='Invited';
      state.applications[id].slot='Tomorrow at 10 am IST · Main reception (sample)';
      save(); render();
    }break;
    case 'confirm':
    case 'decline': if(!employer&&state.applications[id]?.stage==='Invited'){
      state.applications[id].stage=cmd==='confirm'?'Confirmed':'Declined';save();render();
    }break;
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='apply-form') return;
  event.preventDefault();
  if(employer || !event.target.reportValidity()) return;
  state.applications[currentJob.id] ??= {stage:'Applied',practice:currentJob.id==='warehouse'&&state.practiced};
  save();go('Applications');
});
render();
</script>
</body>
</html>
